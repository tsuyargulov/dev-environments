# Keycloak IdP mock for the devenv factory auth demo.
#
# LocalStack (which provides the STS endpoint) runs SEPARATELY as an already-up
# sibling container on :4566 with its Hobby auth token — we don't manage it here,
# we just point at it. This compose only stands up Keycloak.
#
#   docker compose up -d          # start Keycloak (first run pulls the image)
#   docker compose logs -f keycloak   # watch boot
#   docker compose down           # stop + remove
#
# Admin console: http://localhost:8080  (admin / admin)
name: devenv-factory

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: devenv-keycloak
    command: ["start-dev"]
    environment:
      # Keycloak 26+ bootstrap admin (older images used KEYCLOAK_ADMIN/_PASSWORD).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Health/metrics endpoints on the management port (9000) — used to check readiness.
      KC_HEALTH_ENABLED: "true"
      # Dev only: don't cache themes/templates so Qbank theme edits show on refresh.
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    volumes:
      - ./themes/qbank:/opt/keycloak/themes/qbank
    ports:
      - "8080:8080"   # HTTP (console + OIDC endpoints)
      - "9000:9000"   # management (health/ready, metrics)
